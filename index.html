var listEl=document.getElementById('list'),qEl=document.getElementById('q'),pagerEl=document.getElementById('pager');
function filtered(){
  var q=(state.q||'').trim().toLowerCase();
  return WORDS.filter(function(w){
    if(state.filter==='conf'&&!w.conf.length)return false;
    if(state.filter==='todo'&&state.known[w.w])return false;
    if(state.filter==='done'&&!state.known[w.w])return false;
    if(q&&w.w.toLowerCase().indexOf(q)<0&&w.zh.indexOf(q)<0)return false;
    return true;
  });
}
function cardHTML(w){
  var known=!!state.known[w.w];
  return '<div class="card'+(w.g>=0?' g'+w.g:'')+(known?' known':'')+'" data-w="'+esc(w.w)+'">'
  +'<div class="wrow"><button class="spk" data-speak="'+esc(w.w)+'">'+SPKS+'</button>'
  +'<span class="word" data-speak="'+esc(w.w)+'">'+esc(w.w)+'</span>'+(w.ipa?'<span class="muted" style="font-size:13px">'+esc(w.ipa)+'</span>':'')
  +(w.g>=0?'<span class="gdot g'+w.g+'"></span><span class="badge2">易混组</span>':'')
  +'<span style="flex:1"></span><button data-toggle="'+esc(w.w)+'" style="font-size:13px;padding:5px 11px">'+(known?'取消掌握':'标记掌握')+'</button></div>'
  +'<div data-mean style="display:none;margin-top:7px;font-size:15px;line-height:1.55"><span class="muted">'+esc(w.pos)+'</span> '+esc(w.zh)
  +(w.conf.length?'<div class="muted" style="margin-top:4px">易混：'+w.conf.map(esc).join(' / ')+'</div>':'')+'</div>'
  +'<div class="muted" data-hint style="margin-top:4px">点卡片看释义</div></div>';
}
function renderList(){
  var rows=filtered();var pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
  if(state.page>pages)state.page=pages; if(state.page<1)state.page=1;
  listEl.innerHTML=rows.length?rows.slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE).map(cardHTML).join(''):'<p class="muted">没有符合条件的单词。</p>';
  var h='';
  if(pages>1){h='<button data-pg="prev"'+(state.page<=1?' disabled':'')+'>上一页</button>';for(var i=1;i<=pages;i++){h+='<button data-pg="'+i+'"'+(i===state.page?' class="on"':'')+'>'+i+'</button>';}h+='<button data-pg="next"'+(state.page>=pages?' disabled':'')+'>下一页</button>';}
  pagerEl.innerHTML=h; renderStat();
}
listEl.addEventListener('click',function(e){
  var sp=e.target.closest('[data-speak]'); if(sp){speak(sp.getAttribute('data-speak'));return;}
  var tg=e.target.closest('[data-toggle]'); if(tg){var w=tg.getAttribute('data-toggle');state.known[w]=!state.known[w];if(state.known[w])delete state.again[w];save();renderList();return;}
  var card=e.target.closest('.card'); if(card){var m=card.querySelector('[data-mean]'),hh=card.querySelector('[data-hint]');var s=m.style.display==='none';m.style.display=s?'':'none';hh.style.display=s?'none':'';}
});
pagerEl.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;var v=b.getAttribute('data-pg');var pages=Math.max(1,Math.ceil(filtered().length/PAGE_SIZE));if(v==='prev')state.page=Math.max(1,state.page-1);else if(v==='next')state.page=Math.min(pages,state.page+1);else state.page=parseInt(v,10);renderList();});
qEl.addEventListener('input',function(){state.q=qEl.value;state.page=1;renderList();});
function syncFilters(){document.querySelectorAll('#filters button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-f')===state.filter);});}
document.getElementById('filters').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.filter=b.getAttribute('data-f');state.page=1;syncFilters();renderList();});
/* controls */
document.getElementById('deckbar').addEventListener('click',function(e){
  var b=e.target.closest('[data-deck]');
  if(b){state.deck=b.getAttribute('data-deck');rebuild();save();renderCard();return;}
  if(e.target.closest('#autospeak')){state.autoSpeak=!state.autoSpeak;save();renderCard();if(state.autoSpeak&&state.queue[0])speak(state.queue[0]);}
});
document.getElementById('skipbtn').addEventListener('click',function(){if(state.queue.length>1){state.queue.push(state.queue.shift());}state.show=false;save();renderCard();});
document.getElementById('shufflebtn').addEventListener('click',function(){for(var i=state.queue.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=state.queue[i];state.queue[i]=state.queue[j];state.queue[j]=t;}state.show=false;save();renderCard();});
document.getElementById('resetbtn').addEventListener('click',function(){state.known={};state.again={};rebuild();save();renderCard();});
function setMode(m){
  state.mode=m;
  document.querySelectorAll('#modebar button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-mode')===m);});
  document.getElementById('cardview').style.display=m==='card'?'':'none';
  document.getElementById('listview').style.display=m==='list'?'':'none';
  if(m==='card')renderCard();else renderList();
  save();
}
document.getElementById('modebar').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;setMode(b.getAttribute('data-mode'));});
try{var s=JSON.parse(localStorage.getItem('cet6flash-v4')||'null');if(s&&typeof s==='object'){state=Object.assign(state,s);}}catch(e){}
if(!Array.isArray(state.queue))state.queue=[];
qEl.value=state.q||''; syncFilters();
setMode(state.mode==='list'?'list':'card');
if(bridge&&window.addEventListener){window.addEventListener('hatch-widget-state',function(ev){if(ev.detail&&ev.detail.state){state=Object.assign(state,ev.detail.state);qEl.value=state.q||'';syncFilters();if(state.mode==='list')renderList();else renderCard();}});}
})();
</script></div></body></html>
